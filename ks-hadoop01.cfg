# Hadoop 集群第一台虚拟机（hadoop01 / master）无人值守安装应答文件
# 适用于 AlmaLinux 8.10 minimal（KVM/libvirt，BIOS 光盘引导）

#version=RHEL8
text
lang en_US.UTF-8
keyboard us
timezone Asia/Shanghai

rootpw --plaintext Hadoop@123

zerombr
clearpart --all --initlabel
autopart --type=lvm

selinux --disabled

%packages
@^minimal-environment
vim
wget
%end

%post --log=/root/ks-post.log
# 学习环境：关闭防火墙
systemctl disable firewalld

# 创建 hadoop 用户（wheel 组）
useradd -m -G wheel hadoop
echo 'hadoop:Hadoop@123' | chpasswd

# 静态网络：直接写 NetworkManager keyfile，不依赖守护进程
rm -f /etc/sysconfig/network-scripts/ifcfg-*
mkdir -p /etc/NetworkManager/system-connections
cat > /etc/NetworkManager/system-connections/ens3.nmconnection <<'NMEOF'
[connection]
id=ens3
type=ethernet
interface-name=ens3
autoconnect=true

[ipv4]
method=manual
address1=192.168.122.11/24,192.168.122.1
dns=192.168.122.1;

[ipv6]
method=disabled
NMEOF
chmod 600 /etc/NetworkManager/system-connections/ens3.nmconnection

hostnamectl set-hostname hadoop01
systemctl enable sshd
%end

# 装完直接关机（防光盘引导循环），由宿主机弹出光盘后再启动
shutdown